name: Hello World!

on:
  push:
    branches:
      - master

jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: |
          echo "Hello World!"
          echo "new Hello World!"
  date_job:
    runs-on: ubuntu-latest
    steps:
        - name: Now it is
          run: |
            echo date
  directory_content_job:
    runs-on: ubuntu-latest
    steps:
        - name: Directory content
          run: |
            echo ls -l